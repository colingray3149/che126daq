# EXP2 CONTROL SETTINGS
# Save this file, then type: start exp2
# Each START reloads these values. Editing alone does NOT change an active run.
# This does not adjust the variac; its voltage is set/measured manually.

# Desired TC1 (heater) temperature, degrees C.
target_C = 300.0

# Heat turns ON at or below target_C - hysteresis_C (currently 297 C).
# Heat turns OFF at target_C, or earlier if the prediction below reaches it.
hysteresis_C = 3.0

# Runtime emergency cutoffs, degrees C. These are NOT START requirements.
# A new explicit START re-arms after a trip; cooling alone does not.
tc1_cutoff_C = 320.0
tc2_cutoff_C = 85.0

# TC2 stays optional. If absent, rear-side protection is unavailable.
# false disables the TC2 cutoff even when TC2 has a reading.
tc2_cutoff_enabled = true

# Predictive OFF: TC1 + max(recent heating rate, 0) * this many seconds.
# Set to 0 for ordinary temperature-only hysteresis.
prediction_lead_s = 5.0

# Minimum time OFF before heating can turn ON again, seconds.
# Safety/predictive OFF is immediate. Very short values wear the relay.
min_off_s = 5.0

# Hold timer runs continuously inside target_C +/- hold_band_C.
# Leaving this band resets the hold timer.
hold_band_C = 5.0

# Shut off after this many continuous seconds in the hold band.
# 1800 = 30 minutes. Set 0 to disable timed completion; STOP/cutoffs still work.
hold_s = 1800.0

# false: physical TC1 is the heater and physical TC2 is the rear/barrier probe.
# This changes controller input mapping only; CSV columns always stay raw TC1/TC2.
swap_inputs = false

# Host-only record of the manual variac preset; never measured or changed by software.
variac_voltage_V = 30.0
